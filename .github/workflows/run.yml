
name: TrendClip Daily Video Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r Requirements.txt

      - name: Create output folder
        run: mkdir -p output

      - name: Generate trending topics and scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python Main.py

      - name: Create YouTube Shorts videos
        run: python video_creator.py

      - name: Upload generated files, even if a step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendclip-daily-files
          path: output/
          if-no-files-found: warn
          retention-days: 7
