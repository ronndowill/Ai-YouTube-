
name: TrendClip AI Starter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run TrendClip AI
        run: python Main.py

      - name: Save trend research files
        uses: actions/upload-artifact@v4
        with:
          name: trendclip-daily-research
          path: output/
          if-no-files-found: warn
