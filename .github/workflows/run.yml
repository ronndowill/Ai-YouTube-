
name: TrendClip AI Starter

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: pip install -r Requirements.txt

      - name: Generate trends and AI scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python Main.py

      - name: Create vertical YouTube Short
        run: python video_creator.py

      - name: Save generated files
        uses: actions/upload-artifact@v4
        with:
          name: trendclip-daily-videos
          path: |
            output/*.mp4
            output/*.mp3
            output/*.txt
            output/*.csv
          if-no-files-found: error
